<div class="p-4">
  <div class="d-flex align-items-center mb-3">
    <h1 class="mb-0">Workspaces</h1>
    <div class="ms-3">
      <button
        type="button"
        class="btn btn-success text-white rounded-circle d-flex align-items-center justify-content-center p-0 plus-button"
        (click)="openModal()"
      ><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  @if (loading()) {
    <div class="text-center py-3">
      <p class="text-muted">Loading workspaces...</p>
    </div>
  } @else {
    @for (node of nodes(); track node.id) {
      <app-content-node [node]="node" (nodeAdded)="loadNodes()" />
    } @empty {
      <p class="text-center text-muted py-3">No workspaces yet.</p>
    }
  }
</div>

<app-add-workspace-modal
  [show]="showModal"
  (closed)="onModalClosed()"
  (saved)="onModalSaved()"
></app-add-workspace-modal>
