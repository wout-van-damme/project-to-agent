<div class="container py-4">
  <button
    type="button"
    class="btn btn-link p-0 mb-4 back-button"
    (click)="goBack()"
  >
    <i class="fa-solid fa-arrow-left fa-2x"></i>
  </button>

  @if ((node$ | async); as node) {
    
    <div class="d-flex align-items-center">
      <h1>{{ node.title }}</h1>
      <span class="badge bg-secondary">{{ node.type }}</span>  

      @if (!editMode) {
        <button
          type="button"
          class="btn btn-sm btn-outline-success ms-3"
          (click)="play()"
          [disabled]="isPlaying"
        >
          <i class="fa-solid fa-play"></i> {{ isPlaying ? 'Running...' : 'Play' }}
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-warning ms-2"
        >
          <i class="fa-solid fa-pause"></i> Pause
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary edit-button ms-3"
          (click)="startEdit(node)"
        >
          <i class="fa-solid fa-pen-to-square"></i> Edit
        </button>
      }
    </div>

    <hr>

    @if (editMode) {
      <div class="assigned-agents mb-3">
        <label class="fw-bold me-2" for="editAgent">Assigned Agent:</label>
        <select
          id="editAgent"
          class="form-select"
          [(ngModel)]="editAgentId"
          style="max-width: 300px;"
        >
          <option [ngValue]="null">No agent</option>
          @for (agent of (agents$ | async); track agent.id) {
            <option [ngValue]="agent.id">{{ agent.name }}</option>
          }
        </select>
      </div>
    } @else if (node.agent) {
      <div class="assigned-agents mb-3">
        <span class="fw-bold me-2">Assigned Agent:</span>
        <span class="badge bg-info text-dark me-1"><i class="fa-solid fa-robot me-1"></i>{{ node.agent.name }}</span>
      </div>
    }

    <div class="task-description">
        <span class="fw-bold me-2">Description:</span>
      @if (editMode) {
        <textarea
          class="form-control description-textarea"
          [(ngModel)]="editDescription"
          rows="10"
        ></textarea>
        <div class="mt-2">
          <button
            type="button"
            class="btn btn-sm btn-primary me-2"
            (click)="saveEdit()"
          >
            Save
          </button>
          <button
            type="button"
            class="btn btn-sm btn-secondary"
            (click)="cancelEdit()"
          >
            Cancel
          </button>
        </div>
      } @else {
        <div [innerHTML]="renderMarkdown(node.description)"></div>
      }
    </div>

    <app-comment [nodeId]="currentNodeId!" />
  }
</div>
