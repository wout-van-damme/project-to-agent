<div class="card mb-2 agent-detail-card">
  <div class="card-body py-2 px-3">
    <div class="d-flex align-items-center gap-2 mb-2">
      <h6 class="mb-0 fw-bold">{{ agent.name }}</h6>
      <span class="badge bg-primary">{{ agent.provider }}</span>
    </div>
    <div class="row g-2 mb-2">
      <div class="col-6">
        <div class="d-flex flex-column gap-1">
          <span class="text-muted small fw-bold text-uppercase">Model</span>
          <span class="text-body">{{ agent.modelName }}</span>
        </div>
      </div>
      <div class="col-6">
        <div class="d-flex flex-column gap-1">
          <span class="text-muted small fw-bold text-uppercase">URL</span>
          <span class="text-body text-break">{{ agent.url }}</span>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end gap-2 mt-2">
      <button class="btn btn-sm btn-outline-danger" (click)="deleteAgent()">Delete</button>
      <button class="btn btn-sm btn-outline-primary" (click)="openEditModal()">Edit</button>
    </div>
  </div>
</div>

<app-agent-edit-modal
  [show]="showEditModal"
  [agent]="agent"
  (closed)="closeEditModal()"
  (saved)="onAgentSaved()"
></app-agent-edit-modal>
