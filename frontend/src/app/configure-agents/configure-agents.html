<div class="p-4">
  <div class="d-flex align-items-center mb-3">
    <h1 class="mb-0">Configure Agents</h1>
    <div class="ms-3">
      <button
        type="button"
        class="btn btn-success text-white rounded-circle d-flex align-items-center justify-content-center p-0 plus-button"
        (click)="openModal()"
      ><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  @if (loading()) {
    <div class="text-center py-3">
      <p class="text-muted">Loading agents...</p>
    </div>
  } @else {
    @for (agentConfig of (agentConfigs$ | async); track agentConfig.id) {
      <app-agent-detail 
        [agent]="agentConfig" 
        (agentUpdated)="onAgentUpdated()" 
        (agentDeleted)="onAgentDeleted($event)">
      </app-agent-detail>
    } @empty {
      <p class="text-center text-muted py-3">No agents configured yet.</p>
    }
  }
</div>

<app-agent-modal [show]="showModal" (closed)="closeModal()" />
