<div class="p-4">
  <div class="d-flex align-items-center mb-3">
    <h1 class="mb-0">Configure Tool Sets</h1>
    <div class="ms-3">
      <button
        type="button"
        class="btn btn-success text-white rounded-circle d-flex align-items-center justify-content-center p-0 plus-button"
        (click)="openModal()"
      ><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  @for (toolSetConfig of (toolSetConfigs$ | async); track toolSetConfig.id) {
    <app-tool-detail
      [toolSet]="toolSetConfig"
      (toolSetUpdated)="updateToolSets()"
      (toolSetDeleted)="deleteToolSet($event)">
    </app-tool-detail>
  }
</div>

<app-tool-modal [show]="showModal" (closed)="closeModal()" />
