<div class="p-4">
  <div class="d-flex align-items-center mb-3">
    <h1 class="mb-0">Configure Tools</h1>
    <div class="ms-3">
      <button
        type="button"
        class="btn btn-success text-white rounded-circle d-flex align-items-center justify-content-center p-0 plus-button"
        (click)="openModal()"
      ><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  @for (toolConfig of (toolConfigs$ | async); track toolConfig.id) {
    <app-tool-detail
      [tool]="toolConfig"
      (toolUpdated)="onToolUpdated()"
      (toolDeleted)="onToolDeleted($event)">
    </app-tool-detail>
  }
</div>

<app-tool-modal [show]="showModal" (closed)="closeModal()" />
