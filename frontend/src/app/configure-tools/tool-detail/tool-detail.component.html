<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="card-title mb-0">{{ toolSet.name }}</h5>
      <div>
        <button class="btn btn-sm btn-outline-primary me-2" (click)="openEditModal()">
          <i class="fa-solid fa-pen"></i> Edit
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteToolSet()">
          <i class="fa-solid fa-trash"></i> Delete
        </button>
      </div>
    </div>
    <div>
      <small class="text-muted mb-1">Tools:</small>
      <div class="d-flex flex-wrap gap-1">
        @for (tool of toolSet.tools; track tool.id) {
          <span class="badge bg-secondary">{{ tool.name }} ({{ tool.category }})</span>
        }
      </div>
    </div>
  </div>
</div>

<app-tool-detail-edit-modal
  [show]="showEditModal"
  [toolSetName]="toolSet.name"
  [toolSetId]="toolSet.id"
  [currentToolIds]="currentToolIds"
  (closed)="onEditModalClosed()"
  (saved)="onEditModalSaved()"
></app-tool-detail-edit-modal>
