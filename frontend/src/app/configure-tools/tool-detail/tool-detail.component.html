<div class="card mb-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <h5 class="card-title mb-0">{{ tool.name }}</h5>
      <div>
        <button class="btn btn-sm btn-outline-primary me-2" (click)="openEditModal()">
          <i class="fa-solid fa-pen"></i> Edit
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteTool()">
          <i class="fa-solid fa-trash"></i> Delete
        </button>
      </div>
    </div>
  </div>
</div>

@if (showEditModal) {
  <div class="modal d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Tool</h5>
          <button type="button" class="btn-close" (click)="closeEditModal()"></button>
        </div>
        <form (ngSubmit)="saveEdit()">
          <div class="modal-body">
            <div class="mb-3">
              <label for="editToolName" class="form-label">Name</label>
              <input id="editToolName" type="text" class="form-control" [(ngModel)]="editName" name="editName" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeEditModal()">Cancel</button>
            <button type="submit" class="btn btn-success text-white px-3">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" (click)="closeEditModal()"></div>
}
