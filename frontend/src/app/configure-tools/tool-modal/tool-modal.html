@if (show()) {
  <div class="modal d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Tool Set</h5>
          <button type="button" class="btn-close" (click)="close()"></button>
        </div>
        <form (ngSubmit)="onSubmit()">
          <div class="modal-body">
            <div class="mb-3">
              <label for="toolSetName" class="form-label">Tool Set Name</label>
              <input id="toolSetName" type="text" class="form-control" [(ngModel)]="toolSetName" name="toolSetName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Select Tools</label>
              <div class="row">
                @for (tool of (availableTools$ | async); track tool.id) {
                  <div class="col-md-4 mb-2">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        [id]="'tool-' + tool.id"
                        [checked]="isSelected(tool.id)"
                        (change)="toggleTool(tool.id)"
                      />
                      <label class="form-check-label" [for]="'tool-' + tool.id">
                        {{ tool.name }} ({{ tool.category }})
                      </label>
                    </div>
                  </div>
                }
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
            <button type="submit" class="btn btn-success text-white px-3" [disabled]="!toolSetName.trim() || selectedToolIds.length === 0">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" (click)="close()"></div>
}
